<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B0F1F'/%3E%3Cpath d='M12 3 19 6.5V12c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6.5L12 3Z' fill='%238B7CF6'/%3E%3C/svg%3E">
<title>Mon compte — XAU Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1F; --panel:#131A2E; --panel-2:#1A2340; --line:#262F4D;
    --violet:#8B7CF6; --violet-bright:#A99BFF;
    --text:#E7E9F5; --muted:#8890AA; --green:#34D399; --red:#F87171;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}
  nav{border-bottom:1px solid var(--line);}
  nav .wrap{min-height:66px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.02rem;flex:none;}
  a.back{color:var(--muted);text-decoration:none;font-size:0.9rem;}
  a.back:hover{color:var(--violet-bright);}

  main{padding:44px 0 70px;}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 30px;}
  h2{font-size:1rem;font-weight:600;margin:0 0 16px;color:var(--violet-bright);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
  .row:first-child{border-top:none;padding-top:0;}
  .row .k{color:var(--muted);font-size:0.9rem;}
  .row .v{font-weight:600;font-size:0.95rem;}

  .badge{padding:5px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;}
  .badge.member{background:rgba(139,124,246,0.16);color:var(--violet-bright);}
  .badge.free{background:rgba(136,144,170,0.14);color:var(--muted);}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:#0E1120;padding:11px 20px;border-radius:6px;font-weight:600;font-size:0.9rem;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--violet-bright);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.ghost:hover{border-color:var(--violet);}

  .msg{margin-top:14px;font-size:0.88rem;padding:11px 13px;border-radius:6px;display:none;}
  .msg.ok{display:block;background:rgba(52,211,153,0.12);color:#9FDCC0;border:1px solid rgba(52,211,153,0.3);}
  .msg.error{display:block;background:rgba(248,113,113,0.12);color:#F5A3A3;border:1px solid rgba(248,113,113,0.3);}

  .loading{text-align:center;color:var(--muted);padding:60px 0;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2 20 6v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4Z" stroke="#8B7CF6" stroke-width="1.4"/></svg>
      XAU Guardian
    </div>
    <a class="back" href="dashboard.html">← Tableau de bord</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <h1>👤 Mon compte</h1>

    <div id="loading" class="loading">Chargement…</div>

    <div id="content" style="display:none;">
      <div class="card">
        <h2>Informations</h2>
        <div class="row"><span class="k">E-mail</span><span class="v" id="acc-email">—</span></div>
      </div>

      <div class="card">
        <h2>Abonnement</h2>
        <div class="row">
          <span class="k">Statut</span>
          <span class="badge" id="acc-status">—</span>
        </div>
        <div class="row" id="renewal-row" style="display:none;">
          <span class="k">Prochain renouvellement</span>
          <span class="v mono" id="acc-renewal">—</span>
        </div>
        <div id="upgrade-cta" style="margin-top:16px;display:none;">
          <a class="btn" href="tarifs.html">Passer Membre</a>
        </div>
      </div>

      <div class="card">
        <h2>Sécurité</h2>
        <p style="color:var(--muted);font-size:0.9rem;margin:0 0 16px;">Pour changer ton mot de passe, on t'envoie un lien sécurisé par e-mail — comme ça, personne d'autre que toi ne peut le faire.</p>
        <button class="btn ghost" id="reset-btn">Recevoir un lien de changement de mot de passe</button>
        <div class="msg" id="reset-msg"></div>
      </div>

      <button class="btn ghost" id="logout-btn">Se déconnecter</button>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = 'fr';
  const db = getFirestore(app);

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "auth.html"; return; }
    currentUser = user;

    document.getElementById('acc-email').textContent = user.email;

    try {
      const memberDoc = await getDoc(doc(db, 'members', user.email));
      const statusEl = document.getElementById('acc-status');
      if (memberDoc.exists()) {
        statusEl.textContent = '⭐ Membre';
        statusEl.className = 'badge member';
        const data = memberDoc.data();
        if (data.renouvellement) {
          document.getElementById('renewal-row').style.display = 'flex';
          document.getElementById('acc-renewal').textContent = data.renouvellement;
        }
      } else {
        statusEl.textContent = '🆓 Découverte';
        statusEl.className = 'badge free';
        document.getElementById('upgrade-cta').style.display = 'block';
      }
    } catch (e) {
      document.getElementById('acc-status').textContent = 'Indisponible';
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  });

  document.getElementById('reset-btn').addEventListener('click', async () => {
    const msgEl = document.getElementById('reset-msg');
    msgEl.className = 'msg';
    msgEl.textContent = '';
    try {
      await sendPasswordResetEmail(auth, currentUser.email);
      msgEl.className = 'msg ok';
      msgEl.textContent = `Un e-mail a été envoyé à ${currentUser.email}. Pense à vérifier tes spams.`;
    } catch (err) {
      msgEl.className = 'msg error';
      msgEl.textContent = "Impossible d'envoyer l'e-mail pour le moment. Réessaie plus tard.";
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = "auth.html";
  });
</script>

</body>
</html>
