<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — XAU Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1F; --panel:#131A2E; --line:#262F4D;
    --gold:#8B7CF6; --gold-bright:#A99BFF;
    --text:#E7E9F5; --muted:#8890AA; --green:#6E9A7C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2{font-weight:600;margin:0;}
  .wrap{max-width:920px;margin:0 auto;padding:0 28px;}
  nav{border-bottom:1px solid var(--line);}
  nav .wrap{height:68px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem;}
  button.logout{
    background:transparent;border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:3px;font-family:inherit;cursor:pointer;font-size:0.9rem;
  }
  button.logout:hover{border-color:var(--gold);}
  main{padding:56px 0;}
  .hello{color:var(--muted);}
  .hello strong{color:var(--gold-bright);font-weight:600;}
  .empty{
    margin-top:40px;border:1px dashed var(--line);border-radius:6px;
    padding:48px 32px;text-align:center;color:var(--muted);
  }
  .empty h2{font-size:1.3rem;color:var(--text);margin-bottom:10px;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 20 6v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4Z" stroke="#8B7CF6" stroke-width="1.4"/>
      </svg>
      XAU Guardian
    </div>
    <div style="display:flex;align-items:center;gap:20px;">
      <a href="https://t.me/+-aD8_q-5Qf9lNTU0" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:none;font-size:0.9rem;">📢 Telegram</a>
      <a href="outil-signal.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem;">📐 Générateur de niveaux</a>
      <a href="assistant.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem;">🤖 Assistant IA</a>
      <a href="tarifs.html" style="color:var(--muted);text-decoration:none;font-size:0.9rem;">💳 Tarifs</a>
      <button class="logout" id="logout-btn">Se déconnecter</button>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <p class="hello">Connecté en tant que <strong id="user-email">…</strong></p>
    <div class="empty">
      <h2>🔔 Aucune alerte pour l'instant</h2>
      <p>Vos signaux XAUUSD apparaîtront ici dès qu'ils seront publiés sur le canal.</p>
    </div>

    <div style="margin-top:24px;text-align:center;">
      <a href="outil-signal.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#0E1120;padding:12px 22px;border-radius:4px;text-decoration:none;font-weight:600;font-size:0.95rem;">
        📐 Ouvrir le générateur de niveaux
      </a>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "auth.html";
    } else {
      document.getElementById('user-email').textContent = user.email;
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = "auth.html";
  });
</script>

</body>
</html>
